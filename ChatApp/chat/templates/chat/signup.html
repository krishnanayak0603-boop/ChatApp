
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Connectly</title>
</head>
<body>
    <h1>Join Connectly 💬</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'chat:login' %}">Login</a>
    </p>

    <a href="{% url 'chat:room_list' %}">Back to rooms</a>
</body>
</html>
